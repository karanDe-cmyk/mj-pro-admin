apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: matka
  labels:
    app: frontend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      name: frontend
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: saurav547/matka-frontend:v1.2
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"  # 100 milli-CPU (0.1 CPU core)
              memory: "256Mi"  # 256 MB memory
            limits:
              cpu: "500m"  # 500 milli-CPU (0.5 CPU core)
              memory: "512Mi"  # 512 MB memory
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: matka
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      nodePort: 31000
