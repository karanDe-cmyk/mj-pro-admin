apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: matka
  labels:
    app: frontend
    service: matka
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      service: matka
  template:
    metadata:
      name: frontend
      labels:
        app: frontend
        service: matka
    spec:
      containers:
        - name: frontend
          image: saurav547/matka-frontend:v1.4
          ports:
            - containerPort: 3000
            resources:
              requests:
                memory: "900Mi"
                cpu: "250m"
              limits:
                memory: "1Gi"
                cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: matka
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      nodePort: 31000
