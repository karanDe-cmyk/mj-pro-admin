apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: matka
  labels:
    app: frontend
spec:
  replicas: 2  # Scale accordingly
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      name: frontend
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: saurav547/matka-frontend:v1.2
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          env:
            - name: REACT_APP_API_URL
              value: "http://api.kalyandpboss.shop"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: matka
spec:
  type: LoadBalancer  # LoadBalancer for cloud-based production
  selector:
    app: frontend
  ports:
    - port: 80   # Change port for external access (use 80 or 443 for HTTP/HTTPS)
      targetPort: 3000
      protocol: TCP
