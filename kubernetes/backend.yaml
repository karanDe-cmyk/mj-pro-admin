apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: matka
  labels:
    app: backend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      name: backend
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: saurav547/matka-backend:v1.4
          ports:
            - containerPort: 5001
          resources:  # Add this section
            requests:
              cpu: "100m"  # 0.1 CPU
              memory: "200Mi"  # 200 MiB of memory
            limits:
              cpu: "500m"  # 0.5 CPU
              memory: "500Mi"  # 500 MiB of memory
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: matka
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 5001
      targetPort: 5001
      protocol: TCP
      nodePort: 31100
