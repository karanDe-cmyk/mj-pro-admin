apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matka-ingress
  namespace: jannat-admin
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/whitelist-source-range: "172.27.224.0/22"  # Adjust this to match your VPN IP range
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.jannatmatka.shop
    - admin.jannatmatka.shop
    secretName: matka-tls-secret
  rules:
  - host: admin.jannatmatka.shop
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000

  - host: api.jannatmatka.shop
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000
