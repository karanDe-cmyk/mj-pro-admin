apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain  # ✅ Keeps the PV after the PVC is deleted
  storageClassName: mongo-storage  # ✅ Matches PVC
  hostPath:
    path: /data/db  # ✅ Correct MongoDB path
    type: DirectoryOrCreate
