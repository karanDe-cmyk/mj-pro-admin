apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-pv-0  # Unique name for each PV
  namespace: matka
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: kalyand-storage-class
  local:
    path: /mnt/data/mongodb-0  # Change path to unique locations for each PV
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ip-192-168-49-50.ap-south-1.compute.internal
                - ip-192-168-66-111.ap-south-1.compute.internal
---
