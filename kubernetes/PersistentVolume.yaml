apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  storageClassName: mongodb-storage  # ✅ Corrected placement
  persistentVolumeReclaimPolicy: Retain  # ✅ Recommended
  hostPath:
    path: /data/db
