apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: matka
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60  # Scale up if CPU usage exceeds 60%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 65  # Scale up if Memory usage exceeds 65%
