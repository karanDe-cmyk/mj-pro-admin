---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: mongodb-storage
  local:  # ✅ hostPath ki jagah local volume use kiya hai (for on-prem clusters)
    path: "/mnt/data/mongodb"
  nodeAffinity:  # ✅ Ensure this PV is bound to a specific node
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ip-172-31-47-229  # ⚠️ Replace this with the actual node name


---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: matka
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: mongodb-storage

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: matka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:latest
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: MONGO_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: MONGO_PASSWORD
            - name: MONGO_INITDB_DATABASE
              value: matka-app
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc


---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: matka
spec:
  type: ClusterIP  # ✅ LoadBalancer se ClusterIP pe switch kiya for security
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017

