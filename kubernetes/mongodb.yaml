apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: matka
spec:
  serviceName: "mongo-headless-service"  # Matches the headless service name
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:latest
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "newuser"  # Set your MongoDB root username here
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: "newpassword123"  # Set your MongoDB root password here
            - name: MONGO_INITDB_DATABASE
              value: jannatapp  # Set your initial database name
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db

  volumeClaimTemplates:
  - metadata:
      name: mongodb-data
    spec:
      accessModes: 
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
      storageClassName: jannat-storage-class

---

# 1. Headless Service for internal stable networking
apiVersion: v1
kind: Service
metadata:
  name: mongo-headless-service
  namespace: matka
spec:
  clusterIP: None  # Required for StatefulSet
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP

---

# 2. LoadBalancer Service for external access
apiVersion: v1
kind: Service
metadata:
  name: mongo-loadbalancer-service
  namespace: matka
spec:
  type: LoadBalancer     # External access
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
